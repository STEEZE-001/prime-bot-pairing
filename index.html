<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prime Downloader - TikTok Video Downloader</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .card { background: #1e293b; width: 100%; max-width: 480px; padding: 28px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); text-align: center; }
    h1 { color: #38bdf8; font-size: 1.8rem; margin-bottom: 8px; }
    p { color: #94a3b8; font-size: 0.95rem; margin-bottom: 20px; }
    .input-group { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
    input { width: 100%; padding: 14px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 1rem; outline: none; }
    input:focus { border-color: #38bdf8; }
    button { background: #38bdf8; color: #0f172a; font-weight: bold; border: none; padding: 14px; border-radius: 8px; font-size: 1rem; cursor: pointer; transition: 0.2s; }
    button:hover { background: #0284c7; color: #fff; }
    #result { margin-top: 20px; display: none; }
    #result img { width: 100%; max-height: 250px; object-fit: cover; border-radius: 8px; margin-bottom: 12px; }
    .dl-btn { display: block; background: #22c55e; color: #fff; text-decoration: none; padding: 12px; border-radius: 8px; font-weight: bold; }
    .dl-btn:hover { background: #16a34a; }
  </style>
</head>
<body>

  <div class="card">
    <h1>Prime Downloader</h1>
    <p>Download TikTok videos without watermarks instantly</p>

    <div class="input-group">
      <input type="text" id="urlInput" placeholder="Paste TikTok video link here...">
      <button id="fetchBtn" onclick="downloadVideo()">Download Video</button>
    </div>

    <div id="result">
      <img id="thumb" src="" alt="Thumbnail">
      <p id="videoTitle" style="margin-bottom: 12px; font-size: 0.85rem;"></p>
      <a id="downloadLink" class="dl-btn" href="#" target="_blank" download>Download MP4 (No Watermark)</a>
    </div>
  </div>

  <script>
    async function downloadVideo() {
      const urlInput = document.getElementById('urlInput').value.trim();
      const fetchBtn = document.getElementById('fetchBtn');
      const resultDiv = document.getElementById('result');

      if (!urlInput) {
        alert('Please paste a TikTok link first!');
        return;
      }

      fetchBtn.innerText = 'Processing...';
      fetchBtn.disabled = true;
      resultDiv.style.display = 'none';

      try {
        // Automatically targets host URL when deployed together on Render
        const response = await fetch('/api/download', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ videoUrl: urlInput })
        });

        const data = await response.json();

        if (data.success) {
          document.getElementById('thumb').src = data.cover;
          document.getElementById('videoTitle').innerText = data.title;
          document.getElementById('downloadLink').href = data.downloadUrl;
          resultDiv.style.display = 'block';
        } else {
          alert(data.message || 'Failed to fetch video.');
        }
      } catch (err) {
        alert('Connection error. Please try again.');
      } finally {
        fetchBtn.innerText = 'Download Video';
        fetchBtn.disabled = false;
      }
    }
  </script>
</body>
</html>
